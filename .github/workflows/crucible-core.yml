# SPDX-License-Identifier: Apache-2.0
name: Crucible Core validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "src/crucible_core/**"
      - "tests/test_crucible_core.py"
      - "research/crucible_contract.json"
      - "research/ns_crucible_adapter.json"
      - "research/schemas/crucible_*.schema.json"
      - "research/schemas/ns_crucible_adapter.schema.json"
      - "research/clay_target.json"
      - "research/proof_barriers.json"
      - "research/lab_contract.json"
      - "research/precision_referee_contract.json"
      - "tools/validate_crucible_core.py"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/crucible-core.yml"
      - "docs/CRUCIBLE_CORE_V0_1.md"
      - "docs/NS_CRUCIBLE_ADAPTER.md"
      - "docs/CLAIM_LEVELS.md"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "src/crucible_core/**"
      - "research/crucible_contract.json"
      - "research/ns_crucible_adapter.json"
      - "research/schemas/crucible_*.schema.json"
      - "research/schemas/ns_crucible_adapter.schema.json"
      - "research/clay_target.json"
      - "research/proof_barriers.json"
      - "tools/validate_crucible_core.py"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/crucible-core.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install laboratory and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate agent contract
        run: python tools/validate_agent_contract.py
      - name: Validate Crucible Core and NS adapter
        run: python tools/validate_crucible_core.py
      - name: Run Crucible regressions
        run: python -m pytest tests/test_crucible_core.py
