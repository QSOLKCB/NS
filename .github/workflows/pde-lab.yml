# SPDX-License-Identifier: Apache-2.0
name: PDE lab validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "pyproject.toml"
      - "src/ns_lab/**"
      - "tests/**"
      - "research/baseline_identities.json"
      - "research/lab_contract.json"
      - "research/schemas/lab_contract.schema.json"
      - "research/schemas/experiment_manifest.schema.json"
      - "tools/validate_lab_contract.py"
      - "tools/validate_reference_artifacts.py"
      - ".github/workflows/pde-lab.yml"
      - "docs/PDE_LAB_V0_1.md"
      - "docs/NUMERICAL_FAILURE_MODES.md"
      - "docs/SWEEP_PROTOCOL.md"
      - "docs/CLAIM_LEVELS.md"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "pyproject.toml"
      - "src/ns_lab/**"
      - "tests/**"
      - "research/baseline_identities.json"
      - "research/lab_contract.json"
      - "research/schemas/lab_contract.schema.json"
      - "research/schemas/experiment_manifest.schema.json"
      - "tools/validate_lab_contract.py"
      - "tools/validate_reference_artifacts.py"
      - ".github/workflows/pde-lab.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install laboratory and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate laboratory machine contract
        run: python tools/validate_lab_contract.py
      - name: Run unit and replay tests
        run: python -m pytest
      - name: Run deterministic reference smoke case
        shell: bash
        run: |
          rm -rf /tmp/qsol-ns-smoke
          qsol-ns-lab taylor-green \
            --resolution 8 \
            --viscosity 0.01 \
            --dt 0.001 \
            --steps 2 \
            --experiment-id CI_TG_SMOKE \
            --source-commit "${GITHUB_SHA}" \
            --operator-or-agent github-actions \
            --output-dir /tmp/qsol-ns-smoke
          python tools/validate_reference_artifacts.py /tmp/qsol-ns-smoke
