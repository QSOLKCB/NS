# SPDX-License-Identifier: Apache-2.0
name: Sealed holdout validation

on:
  pull_request:
    paths:
      - "src/crucible_core/holdout.py"
      - "src/crucible_core/__init__.py"
      - "tests/test_holdout.py"
      - "research/holdout_contract.json"
      - "research/schemas/holdout-*.schema.json"
      - "tools/validate_holdout.py"
      - "docs/SEALED_HOLDOUT_V0_1.md"
      - "docs/ROADMAP.md"
      - "README.md"
      - ".github/workflows/holdout-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "src/crucible_core/holdout.py"
      - "src/crucible_core/__init__.py"
      - "tests/test_holdout.py"
      - "research/holdout_contract.json"
      - "research/schemas/holdout-*.schema.json"
      - "tools/validate_holdout.py"
      - ".github/workflows/holdout-evaluation.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install laboratory and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate sealed holdout contract
        run: python tools/validate_holdout.py
      - name: Run sealed holdout regressions
        run: python -m pytest tests/test_holdout.py
