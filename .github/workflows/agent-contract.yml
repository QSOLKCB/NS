# SPDX-License-Identifier: Apache-2.0
name: Agent contract validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/agent-contract.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/agent-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate machine-readable agent contract
        run: python tools/validate_agent_contract.py
