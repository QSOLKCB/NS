# SPDX-License-Identifier: Apache-2.0
name: Crucible ledger validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "src/crucible_core/ledger.py"
      - "src/crucible_core/__init__.py"
      - "tests/test_crucible_ledger.py"
      - "research/crucible_ledger_contract.json"
      - "research/schemas/crucible_ledger_*.schema.json"
      - "research/schemas/crucible_transfer_ticket.schema.json"
      - "research/cross_domain_transfer_registry.json"
      - "research/ns_cross_domain_transfer_adapter.json"
      - "tools/validate_crucible_ledger.py"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/crucible-ledger.yml"
      - "docs/CRUCIBLE_LEDGER_V0_1.md"
      - "README.md"
      - "docs/ROADMAP.md"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "AGENTS.schema.json"
      - "src/crucible_core/ledger.py"
      - "src/crucible_core/__init__.py"
      - "research/crucible_ledger_contract.json"
      - "research/schemas/crucible_ledger_*.schema.json"
      - "research/schemas/crucible_transfer_ticket.schema.json"
      - "tools/validate_crucible_ledger.py"
      - "tools/validate_agent_contract.py"
      - ".github/workflows/crucible-ledger.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install laboratory and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate agent contract
        run: python tools/validate_agent_contract.py
      - name: Validate Crucible Core and NS adapter
        run: python tools/validate_crucible_core.py
      - name: Validate Analogy Firewall
        run: python tools/validate_analogy_firewall.py
      - name: Validate Crucible ledger
        run: python tools/validate_crucible_ledger.py
      - name: Run Crucible ledger regressions
        run: python -m pytest tests/test_crucible_ledger.py
